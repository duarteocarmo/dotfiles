bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind x kill-pane
bind '&' kill-window

bind Tab next-window
bind BTab previous-window


set -g mouse on
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

set-option -g allow-rename off
set-option -g automatic-rename off
set-option -g history-limit 5000

set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -sa terminal-overrides ',XXX:RGB'
set-option -sg escape-time 10
set -g focus-events on

setw -g mode-keys vi

# Themes
set -g @pi_window_name_format '#{?#{m/r:^π - ,#{pane_title}},#{s/^π - //:pane_title}:π,#W}'
set -g @pi_status_format '#{P:#{?#{==:#{@pi_status},working}, #[fg=colour50]●,#{?#{==:#{@pi_status},done}, #[fg=colour50]✓,}}}'
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#{E:@pi_window_name_format}#[fg=colour50]#{s/-//:window_flags}#{E:@pi_status_format}'
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#{E:@pi_window_name_format}#[fg=colour244]#{s/-//:window_flags}#{E:@pi_status_format}'


# For popups
unbind t
bind t if-shell '[ "#{session_name}" = "popup" ]' \
    'detach-client' \
    'display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 80% -E "tmux attach -t popup || tmux new -s popup"'
bind -T popup t detach

set -g allow-passthrough on
